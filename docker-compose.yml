version: '3.8'

services:
  # ============================================================
  # 1. Database Service: PostgreSQL dengan Ekstensi PostGIS
  # ============================================================
  db:
    image: postgis/postgis:15-3.3
    container_name: ebrix_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ebrix_db
    ports:
      - "5432:5432"
    volumes:
      - ebrix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ebrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. Backend Service: Flask REST API + Machine Learning Engine
  # ============================================================
  backend:
    build: .
    container_name: ebrix_flask_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ebrix_db
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/ebrix_db
      - SECRET_KEY=ebrix-super-secret-key-2026
      - JWT_SECRET_KEY=ebrix-jwt-secret-key-2026
      - CORS_ORIGINS=*
    volumes:
      # Mount untuk persistensi riwayat prediksi jika diperlukan
      - ./prediction_history.json:/app/prediction_history.json

volumes:
  ebrix_pgdata:
    driver: local
